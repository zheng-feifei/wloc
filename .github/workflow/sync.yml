name: Sync upstream

on:
  schedule:
    # 每 1 小时检查一次更新
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 修正 1: 版本换成 v4
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
          # 修正 3: 核心！必须在这里注入有写入权限的 Token，否则 push 会 403 失败
          token: ${{ secrets.SYNC_TOKEN }} 

      # 下面全部使用原生 Git 命令，最稳妥
      - name: Sync upstream
        run: |
          git remote add upstream https://github.com/Yu9191/wloc.git
          git fetch upstream
          git checkout main

          # 检查上游是否有新代码
          if git diff --quiet upstream/main; then
            echo "🟢 代码与上游一致，无需更新。"
          else
            echo "🔵 发现上游更新，开始同步..."
            # 修正 2: 去掉 --ff-only。改用 merge，防止冲突导致任务中断
            # 如果你的仓库有冲突，使用 git merge 会进入编辑器。加上环境变量可强制使用默认信息
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git merge upstream/main --no-edit
            git push origin main
          fi
